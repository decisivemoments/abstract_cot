experiment_id: mvp_warmup
seed: 42

model:
  base_model: server_assets/models/Qwen3-0.6B
  tokenizer_path: server_assets/models/Qwen3-0.6B
  trust_remote_code: true
  torch_dtype: bfloat16
  attn_implementation: flash_attention_2
  gradient_checkpointing: true

abstract:
  vocab_size: 64
  naming_scheme: excel
  max_trace_length: 128

warmup:
  rounds: 4
  dataset_path: server_assets/datasets/Dolci-Think-SFT-7B-cot
  batch_size: 1
  max_samples: 8192
  learning_rate: 1.0e-5
  max_steps_per_phase: null

profiling:
  memory_snapshot:
    enabled: false
    max_entries: 100000

distributed:
  use_fsdp: false
  nproc_per_node: 8

output:
  root_dir: outputs/experiments
